# Every pull request and every push to master: strict type
# check, lint with layer boundaries, unit and property tests, the package with
# its size budget and frozen API, end-to-end tests in three engines, and the
# 2,000-part performance budget measured alone (one worker).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  # release.yml runs the whole check before it publishes.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Package, size budget
        run: pnpm package
      - name: Frozen API
        run: pnpm api --check

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.project }}
      # The performance spec runs in its own job, where nothing else competes for the machine.
      - run: pnpm e2e --project=${{ matrix.project }}
        env:
          PZ_SKIP_PERF: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: 2,000 parts, one worker
        run: pnpm e2e:annotations editor-performance --workers=1
