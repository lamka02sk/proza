<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The strictest policy a host is likely to set: no inline style or script, no eval. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' ws: wss:; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'none'">
  <title>Strict CSP · Proza</title>
  <link rel="icon" href="/favicon.svg">
</head>
<body>
  <main>
    <h1>The editor under a strict Content Security Policy</h1>
    <p>Target of tests/e2e/csp.spec.ts: every violation is recorded in <code>window.__csp</code>.</p>
    <div id="editor"></div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
