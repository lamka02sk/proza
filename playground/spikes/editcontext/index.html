<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EditContext field spike · Proza</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="../../shared/playground.css">
  <style>::highlight(pz-ime) { text-decoration: underline 2px; }</style>
</head>
<body>
  <header class="pg"><a href="../../"><img src="/svg/proza-znacka-oranzova.svg" alt="Playground"></a><h1>EditContext field spike</h1></header>
  <main class="pg grid">
    <div>
      <div id="toolbar" class="toolbar" role="toolbar" aria-label="Formatting" aria-controls="canvas"></div>
      <div id="canvas" class="canvas" role="group" aria-label="Document"></div>
      <p id="support" class="muted" role="status"></p>
      <p class="muted">Same document and toolbar as the contenteditable spike. Enter splits, Shift+Enter breaks the line, Backspace at the start merges. Ctrl/Cmd+B, I, U, Z, Shift+Z.</p>
    </div>
    <div>
      <section>
        <h2>Input events</h2>
        <p><button class="btn" id="copy-log" type="button">Copy report</button> <button class="btn" id="download-log" type="button">Download report</button> <button class="btn" id="clear-log" type="button">Clear</button></p>
        <pre id="log" class="out" aria-label="Input event log" tabindex="0"></pre>
      </section>
      <section>
        <h2>Document JSON</h2>
        <pre id="json" class="out" aria-label="Document JSON" tabindex="0"></pre>
      </section>
    </div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
